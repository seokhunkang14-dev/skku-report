<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs><rect width="1400" height="920" fill="#fff"/><rect x="65" y="14" width="220" height="48" rx="10" fill="#e8f0ff" stroke="#222" stroke-width="1.5"/><text x="175" y="44" font-size="19" font-weight="700" text-anchor="middle">NFTime 앱</text><line x1="175" y1="62" x2="175" y2="900" stroke="#999" stroke-dasharray="6 5" stroke-width="1.5"/><rect x="415" y="14" width="220" height="48" rx="10" fill="#fff1d6" stroke="#222" stroke-width="1.5"/><text x="525" y="44" font-size="19" font-weight="700" text-anchor="middle">API 서버 (Workers)</text><line x1="525" y1="62" x2="525" y2="900" stroke="#999" stroke-dasharray="6 5" stroke-width="1.5"/><rect x="765" y="14" width="220" height="48" rx="10" fill="#ffeedd" stroke="#222" stroke-width="1.5"/><text x="875" y="44" font-size="19" font-weight="700" text-anchor="middle">MetaMask 앱</text><line x1="875" y1="62" x2="875" y2="900" stroke="#999" stroke-dasharray="6 5" stroke-width="1.5"/><rect x="1115" y="14" width="220" height="48" rx="10" fill="#eef7ee" stroke="#222" stroke-width="1.5"/><text x="1225" y="44" font-size="19" font-weight="700" text-anchor="middle">D1 DB</text><line x1="1225" y1="62" x2="1225" y2="900" stroke="#999" stroke-dasharray="6 5" stroke-width="1.5"/><line x1="175" y1="120" x2="521" y2="120" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="350" y="112" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">1. </tspan>POST /api/auth/request</text><line x1="525" y1="170" x2="1221" y2="170" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="875" y="162" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">2. </tspan>auth_requests 생성 (PENDING)</text><line x1="525" y1="220" x2="179" y2="220" stroke="#777" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="350" y="212" font-size="16" text-anchor="middle" fill="#555"><tspan font-weight="700">3. </tspan>session, metamask 딥링크</text><line x1="175" y1="270" x2="871" y2="270" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="525" y="262" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">4. </tspan>딥링크 실행 (metamask.app.link/dapp/…/connect?s=)</text><line x1="875" y1="320" x2="529" y2="320" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="700" y="312" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">5. </tspan>인앱 브라우저로 /connect 페이지 로드</text><path d="M875 360 h60 v24 h-55" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="945" y="376" font-size="16"><tspan font-weight="700">6. </tspan>eth_requestAccounts · Kairos(1001) 전환</text><line x1="875" y1="420" x2="529" y2="420" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="700" y="412" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">7. </tspan>POST /api/auth/nonce (주소)</text><line x1="525" y1="470" x2="871" y2="470" stroke="#777" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="700" y="462" font-size="16" text-anchor="middle" fill="#555"><tspan font-weight="700">8. </tspan>로그인 메시지 (nonce 포함)</text><path d="M875 510 h60 v24 h-55" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="945" y="526" font-size="16"><tspan font-weight="700">9. </tspan>personal_sign (EIP-191, 가스비 없음)</text><line x1="875" y1="570" x2="529" y2="570" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="700" y="562" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">10. </tspan>POST /api/auth/verify (서명)</text><path d="M525 610 h60 v24 h-55" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><text x="595" y="626" font-size="16"><tspan font-weight="700">11. </tspan>secp256k1 서명 복원 → 주소 일치 확인</text><line x1="525" y1="670" x2="1221" y2="670" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="875" y="662" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">12. </tspan>users · sessions 저장, DONE</text><line x1="875" y1="720" x2="179" y2="720" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="525" y="712" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">13. </tspan>nftime://auth?s= 로 앱 복귀</text><line x1="175" y1="770" x2="521" y2="770" stroke="#222" stroke-width="1.6"  marker-end="url(#a)"/><text x="350" y="762" font-size="16" text-anchor="middle" fill="#111"><tspan font-weight="700">14. </tspan>GET /api/auth/session/{s} (폴링)</text><line x1="525" y1="820" x2="179" y2="820" stroke="#777" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="350" y="812" font-size="16" text-anchor="middle" fill="#555"><tspan font-weight="700">15. </tspan>토큰 + 지갑 주소 → 로그인 완료</text></svg>