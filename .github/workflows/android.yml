name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Run emulator screenshots'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            MSG=$(grep -E "error:|^e: |What went wrong|FAILED|Exception|ERROR" -A6 build.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${MSG}"
            exit 1
          }
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NFTime-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: NFTime-apk, path: NFTime-1.0.0.apk }

  screenshots:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: NFTime-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/screenshots.sh NFTime-1.0.0.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }
