name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/**']
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Run emulator screenshots'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            MSG=$(grep -E "error:|^e: |What went wrong|FAILED|Exception|ERROR" -A6 build.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::${MSG}"
            exit 1
          }
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NFTime-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with: { name: NFTime-apk, path: NFTime-1.0.0.apk }
      - name: Publish release (APK 다운로드 링크)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release delete v1.0.0 -y --cleanup-tag || true
          gh release create v1.0.0 NFTime-1.0.0.apk --title "NFTime v1.0.0 (Android)" --notes "Kaia Kairos 테스트넷용 테스트 빌드. Commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"

  screenshots:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.screenshots) || contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: NFTime-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/screenshots.sh NFTime-1.0.0.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }
      - name: Commit screenshots
        if: always()
        run: |
          mkdir -p docs/screenshots && cp shots/*.png docs/screenshots/ || true
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots && git commit -m "Update screenshots [skip ci]" && git pull --rebase && git push || true
